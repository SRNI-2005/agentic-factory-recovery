[project]
name = "coe"
version = "0.1.0"
description = "Agentic Autonomous Factory Recovery System - Phase 1 data foundation"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]>=3.0",
    "paho-mqtt",
    "pydantic-settings",
    "openpyxl",
    "ortools>=9.10",
    "langgraph>=1.2.11",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langchain-google-genai>=4.3.5",
    "streamlit>=1.62",
    "plotly>=5.24",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: tests requiring Dockerized TimescaleDB (docker compose up -d first)",
    "mqtt: tests also requiring Mosquitto reachable at MQTT_HOST/MQTT_PORT",
    "benchmark: Tier 1 MK01 optimality validation (spec §11)",
    "slow: long-running integration pins excluded from the quick gate",
    "llm: live-provider end-to-end tests (opt-in, spec §11 Tier 5)",
]
